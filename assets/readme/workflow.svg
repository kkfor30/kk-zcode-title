<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">后台命名流程</title>
  <desc id="d">一轮对话结束后触发 Stop Hook；入口立即派生独立 Worker 并返回，不阻塞对话；Worker 读取最近 3 到 5 轮的摘录交给独立模型判断；结果以短事务写回标题并读回核验。</desc>
  <rect width="1200" height="260" rx="24" fill="#21382E"/>
  <text x="56" y="60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#A8C1B2">对话之外，维护标题</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" fill="#F4F2EC">
    <text x="57" y="136" font-size="32" font-weight="600">一轮结束</text>
    <text x="57" y="186" font-size="22" fill="#B9CEC2">Stop Hook 触发</text>
    <text x="341" y="136" font-size="32" font-weight="600">入口秒回</text>
    <text x="341" y="186" font-size="22" fill="#B9CEC2">派生 Worker 后秒回</text>
    <text x="625" y="136" font-size="32" font-weight="600">独立模型</text>
    <text x="625" y="186" font-size="22" fill="#B9CEC2">只读最近 3～5 轮</text>
    <text x="909" y="136" font-size="32" font-weight="600">保留 / 更新</text>
    <text x="909" y="186" font-size="22" fill="#B9CEC2">短事务写回 + 读回核验</text>
  </g>
  <g stroke="#89B69C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M297 126h34m-9-8 9 8-9 8"/>
    <path d="M581 126h34m-9-8 9 8-9 8"/>
    <path d="M865 126h34m-9-8 9 8-9 8"/>
  </g>
</svg>
